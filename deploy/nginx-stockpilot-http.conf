# Initial ACME-only site. Do not expose wallet authentication over plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name stockpilot.endpx.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/stockpilot-acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
