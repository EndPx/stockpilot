# Dedicated zones and site; include from the existing nginx http context.
limit_req_zone $binary_remote_addr zone=stockpilot_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=stockpilot_pages:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name stockpilot.endpx.cloud;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/stockpilot-acme;
        try_files $uri =404;
    }
    location / { return 308 https://stockpilot.endpx.cloud$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stockpilot.endpx.cloud;
    ssl_certificate /etc/letsencrypt/live/stockpilot.endpx.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stockpilot.endpx.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:stockpilot_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    limit_req_status 429;

    # Strip spoofable forwarding identity. Only host loopback can reach the app.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 30s;
    proxy_buffering off;

    location /api/ {
        limit_req zone=stockpilot_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
    location /markets {
        limit_req zone=stockpilot_pages burst=20 nodelay;
        proxy_pass http://127.0.0.1:3100;
    }
    location / { proxy_pass http://127.0.0.1:3100; }
}
