name: stockpilot

services:
  app:
    image: ${STOCKPILOT_IMAGE:?Set an immutable StockPilot release image tag}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=384
      APP_URL: ${APP_URL:?Set the canonical HTTPS origin}
      SESSION_SECRET: ${SESSION_SECRET:?Set a random session secret of at least 32 bytes}
      REDIS_URL: redis://default:${REDIS_PASSWORD:?Set a 64-character random hex password}@redis:6379/0
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # Keep buys disabled for the initial deployment. There is no Jupiter key here.
      INVESTMENTS_ENABLED: "false"
      # Safe only with loopback access and the supplied proxy's X-Real-IP overwrite.
      TRUST_PROXY: "true"
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
    depends_on:
      redis:
        condition: service_healthy
    networks: [egress, store]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=128m,uid=1001,gid=1001,mode=0700
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:8.10-alpine
    user: redis
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set a 64-character random hex password}
    # Password goes into a private tmpfs config, never redis-server's arguments.
    command:
      - /bin/sh
      - -ec
      - |
        case "$$REDIS_PASSWORD" in
          *[!a-fA-F0-9]*|'') echo 'REDIS_PASSWORD must be 64 hex characters' >&2; exit 1 ;;
        esac
        [ "$${#REDIS_PASSWORD}" -eq 64 ] || { echo 'REDIS_PASSWORD must be 64 hex characters' >&2; exit 1; }
        umask 077
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf --bind 0.0.0.0 --protected-mode yes \
          --dir /data --appendonly yes --appendfsync always --aof-load-truncated no \
          --save "" --maxmemory 64mb --maxmemory-policy noeviction
    networks: [store]
    volumes:
      - redis-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli --no-auth-warning ping | grep -q '^PONG$'"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  egress:
  store:
    internal: true

volumes:
  redis-data:
